<script>
  function renderEpisodeList(lang) {
    var cell = document.getElementById("episodeListCell");
    var eps = (window.DOREMI_EPISODES || []).slice().reverse();
    var isJp = (lang === "jp");
    var html = "";
    for (var i = 0; i < eps.length; i++) {
      var e = eps[i];
      var title = isJp ? e.title_jp : e.title;
      var suffix = isJp ? " 放送" : " 放送";
      var label = isJp ? ("【第 " + e.ep + " 話】") : ("【第 " + e.ep + " 话】");
      html += '<img src="img/story_line.gif" width="559" height="10" alt="" style="display:block;margin:0 auto;">';
      html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:4px 16px;">';
      html += '<span style="color:#801681;font-weight:bold;min-width:82px;">' + label + '</span>';
      html += '<a href="episode_summary.html?ep=' + e.ep + '" style="flex:1;font-weight:bold;">' + title + '</a>';
      html += '<span class="font11" style="color:#66525B;white-space:nowrap;margin-left:12px;">' + e.date + suffix + '</span>';
      html += '</div>';
    }
    html += '<img src="img/story_line.gif" width="559" height="10" alt="" style="display:block;margin:0 auto;">';
    cell.innerHTML = html;
  }
  window.onDoremiLanguageChange = renderEpisodeList;
  renderEpisodeList(window.getDoremiLang());
</script>
