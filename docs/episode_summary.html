<script>
  function renderEpisodeSummary(lang) {
    var params = new URLSearchParams(window.location.search);
    var epNum = parseInt(params.get("ep") || "1", 10);
    var list = window.DOREMI_EPISODES || [];
    var item = list.find(function (x) { return x.ep === epNum; }) || list[0];
    if (!item) return;

    var isJp = (lang === "jp");
    var title = isJp ? item.title_jp : item.title;
    var stories = isJp ? item.stories_jp : item.stories;
    var staff = isJp ? item.staff_jp : item.staff;

    document.title = (isJp ? "おジャ魔女どれみ 第" + item.ep + "話 · " : "小魔女DoReMi 第" + item.ep + "话 · ") + title;
    document.getElementById("epNum").textContent = isJp ? ("第 " + item.ep + " 話") : ("第 " + item.ep + " 话");
    document.getElementById("epDate").textContent = item.date;
    document.getElementById("epTitle").textContent = title;
    document.getElementById("mScript").textContent = staff[0] || "-";
    document.getElementById("mDir").textContent = staff[1] || "-";
    document.getElementById("mAnim").textContent = staff[2] || "-";
    document.getElementById("mArt").textContent = staff[3] || "-";

    var rows = "";
    for (var i = 0; i < stories.length; i++) {
      rows += '<tr>';
      rows += '<td valign="top" height="230" class="font12">' + stories[i] + '</td>';
      rows += '<td valign="top" class="img-cell"><img src="' + item.imgs[i] + '" width="320" height="240" alt="ep' + item.ep + '-' + (i + 1) + '"></td>';
      rows += '</tr>';
      if (i < stories.length - 1) {
        rows += '<tr><td colspan="2" align="center" class="img-cell"><img src="img/story_s_line.gif" width="500" height="5" alt=""></td></tr>';
      }
    }
    document.getElementById("epBody").innerHTML = rows;

    var pager = "";
    if (item.ep > 1) {
      pager += '<a href="episode_summary.html?ep=' + (item.ep - 1) + '">' + (isJp ? ('&laquo; 前の話（第 ' + (item.ep - 1) + ' 話）') : ('&laquo; 上一话（第 ' + (item.ep - 1) + ' 话）')) + '</a>';
    } else {
      pager += '<span style="color:#999;">' + (isJp ? '第 1 話です' : '已是第 1 话') + '</span>';
    }
    if (item.ep < 51) {
      pager += '<a href="episode_summary.html?ep=' + (item.ep + 1) + '">' + (isJp ? ('次の話（第 ' + (item.ep + 1) + ' 話） &raquo;') : ('下一话（第 ' + (item.ep + 1) + ' 话） &raquo;')) + '</a>';
    } else {
      pager += '<span style="color:#999;">' + (isJp ? '最終話です' : '已是最终话') + '</span>';
    }
    document.getElementById("epPager").innerHTML = pager;
  }
  window.onDoremiLanguageChange = renderEpisodeSummary;
  renderEpisodeSummary(window.getDoremiLang());
</script>
